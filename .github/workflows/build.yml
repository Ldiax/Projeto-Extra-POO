name: Build e execução

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  executar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: veiculos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar
        run: mvn -B clean compile

      - name: Executar AppVeiculos
        run: mvn -B -q exec:java -Dexec.mainClass=br.edu.faculdade.app.AppVeiculos

